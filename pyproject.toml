[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragflow-async-sdk"
version = "0.1.0"
description = "Async Python SDK for RAGFlow"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "hatchling>=1.28.0",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.3.0",
]

authors = [
  { name = "OliverW" }
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragflow_async_sdk"]

[project.optional-dependencies]

dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]
